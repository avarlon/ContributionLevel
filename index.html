<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContributionLevel</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --primary-color: #d31145; /* AIA 브랜드 컬러 */
            --bg-overlay: rgba(0, 0, 0, 0.45);
            --card-bg: rgba(255, 255, 255, 0.98);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2069&auto=format&fit=crop');
            background-size: cover; background-position: center;
            z-index: -1;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-overlay); z-index: -1;
        }

        .container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; padding: 20px; box-sizing: border-box;
        }

        .step-card {
            background: var(--card-bg);
            padding: 40px; border-radius: 24px;
            width: 100%; max-width: 480px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            display: none;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
            min-height: 450px;
        }

        .step-card.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .progress-bar {
            height: 4px; background: #e2e8f0; border-radius: 2px;
            margin-bottom: 30px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: var(--primary-color);
            transition: width 0.3s ease; width: 0%;
        }

        h2 { font-size: 1.4rem; color: #1e293b; margin-bottom: 25px; line-height: 1.5; word-break: keep-all; }

        .input-group { margin-bottom: 15px; }
        input[type="text"] {
            width: 100%; padding: 15px; border: 2px solid #e2e8f0;
            border-radius: 12px; font-size: 1.1rem; box-sizing: border-box;
        }

        .option-container { display: flex; flex-direction: column; gap: 10px; }
        .option-item {
            display: flex; align-items: center;
            padding: 15px; border: 2px solid #e2e8f0;
            border-radius: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        .option-item:hover { background-color: #f8fafc; }
        .option-item input { margin-right: 15px; transform: scale(1.2); accent-color: var(--primary-color); }
        .option-item.selected { border-color: var(--primary-color); background-color: #fff1f2; }

        .btn-group { margin-top: auto; display: flex; gap: 10px; padding-top: 20px; }
        button {
            flex: 1; padding: 16px; border-radius: 12px; font-size: 1rem;
            font-weight: 700; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-next { background: var(--primary-color); color: white; }
        .btn-prev { background: #f1f5f9; color: #64748b; }

        .result-label { font-size: 1rem; color: #64748b; margin-bottom: 10px; }
        .result-score { font-size: 4.5rem; font-weight: 900; color: var(--primary-color); margin: 15px 0; }
        .restart-btn { background: #1e293b; color: white; margin-top: 20px; }
    </style>
</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="container">
    <div class="step-card active" id="step1">
        <div class="progress-bar"><div class="progress-fill" style="width: 15%"></div></div>
        <h2>의뢰자 본인의 정보를<br>입력해주세요.</h2>
        <div class="input-group"><input type="text" id="userName" placeholder="의뢰인 성함"></div>
        <div class="input-group"><input type="text" id="branchName" placeholder="소속 지점명"></div>
        <div class="btn-group"><button class="btn-next" onclick="nextStep(2)">다음으로</button></div>
    </div>

    <div class="step-card" id="step2">
        <div class="progress-bar"><div class="progress-fill" style="width: 30%"></div></div>
        <h2>영업 대상자의 구분은?</h2>
        <div class="option-container">
            <label class="option-item"><input type="radio" name="customerType" value="30" checked> 기존 고객</label>
            <label class="option-item"><input type="radio" name="customerType" value="40"> 신규 고객</label>
        </div>
        <div class="btn-group">
            <button class="btn-prev" onclick="prevStep(1)">이전</button>
            <button class="btn-next" onclick="handleCustomerType()">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step3">
        <div class="progress-bar"><div class="progress-fill" style="width: 45%"></div></div>
        <h2>신규 고객의 시장 구분은?</h2>
        <div class="option-container">
            <label class="option-item"><input type="radio" name="marketType" value="-10" checked> 1차 시장 (지인)</label>
            <label class="option-item"><input type="radio" name="marketType" value="-5"> 2차 시장 (소개)</label>
            <label class="option-item"><input type="radio" name="marketType" value="0"> 3차 시장 (개척)</label>
        </div>
        <div class="btn-group">
            <button class="btn-prev" onclick="prevStep(2)">이전</button>
            <button class="btn-next" onclick="nextStep(4)">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step4">
        <div class="progress-bar"><div class="progress-fill" style="width: 60%"></div></div>
        <h2>현 진행 상황을 선택해주세요.</h2>
        <div class="option-container">
            <label class="option-item"><input type="radio" name="progressStatus" value="5" checked> 제안 완료 단계</label>
            <label class="option-item"><input type="radio" name="progressStatus" value="0"> 컨설팅 진행 확정</label>
        </div>
        <div class="btn-group">
            <button class="btn-prev" id="prevBtn4" onclick="prevStep(2)">이전</button>
            <button class="btn-next" onclick="nextStep(5)">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step5">
        <div class="progress-bar"><div class="progress-fill" style="width: 75%"></div></div>
        <h2>컨설팅 분야를 모두 선택하세요.</h2>
        <div class="option-container">
            <label class="option-item"><input type="checkbox" name="field" value="10"> 인증</label>
            <label class="option-item"><input type="checkbox" name="field" value="20"> 자금</label>
            <label class="option-item"><input type="checkbox" name="field" value="5"> 일반경영</label>
            <label class="option-item"><input type="checkbox" name="field" value="5"> 절세</label>
            <label class="option-item"><input type="checkbox" name="field" value="30"> R&D</label>
        </div>
        <div class="btn-group">
            <button class="btn-prev" onclick="prevStep(4)">이전</button>
            <button class="btn-next" onclick="nextStep(6)">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step6">
        <div class="progress-bar"><div class="progress-fill" style="width: 90%"></div></div>
        <h2>예상 계약 규모 (단위: 만원)</h2>
        <div class="option-container" style="overflow-y: auto; max-height: 220px;">
            <label class="option-item"><input type="radio" name="amount" value="20" checked> 100 이하</label>
            <label class="option-item"><input type="radio" name="amount" value="15"> 200 이하</label>
            <label class="option-item"><input type="radio" name="amount" value="0"> 300 이하</label>
            <label class="option-item"><input type="radio" name="amount" value="-10"> 500 이하</label>
            <label class="option-item"><input type="radio" name="amount" value="-15"> 1,000 이하</label>
            <label class="option-item"><input type="radio" name="amount" value="-20"> 1,000 초과</label>
        </div>
        <div class="btn-group">
            <button class="btn-prev" onclick="prevStep(5)">이전</button>
            <button class="btn-next" onclick="calculateFinal()">산출 결과 확인</button>
        </div>
    </div>

    <div class="step-card" id="resultPage">
        <div class="result-label" id="finalInfo">지점 - 성함</div>
        <h1 style="margin: 0; color: #1e293b; font-size: 1.6rem;">최종 분배 기여도</h1>
        <div class="result-score" id="finalScore">0</div>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 30px; line-height: 1.6;">
            협업 관련 지표들을 바탕으로 산출된 결과입니다.<br>공정한 분배를 위한 기준으로 활용하세요.
        </p>
        <button class="restart-btn" onclick="location.reload()">새로 측정하기</button>
    </div>
</div>

<script>
    // ▼ [필독] 본인의 구글 앱스 스크립트 배포 URL을 여기에 입력하세요!
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyqHgjX-DzSyhxz0vat12VRKrkbuykZw1BeHuVEC58A8FqZ-iW-JIvtcO5wkebg5JM/exec'; 

    let currentStep = 1;

    function nextStep(step) {
        if(currentStep === 1) {
            if(!document.getElementById('userName').value || !document.getElementById('branchName').value) {
                alert("성함과 지점명을 입력해주세요."); return;
            }
        }
        document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');
        currentStep = step;
    }

    function prevStep(step) {
        document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');
        currentStep = step;
    }

    function handleCustomerType() {
        const type = document.querySelector('input[name="customerType"]:checked').value;
        if (type === "40") {
            nextStep(3);
            document.getElementById('prevBtn4').onclick = () => prevStep(3);
        } else {
            nextStep(4);
            document.getElementById('prevBtn4').onclick = () => prevStep(2);
        }
    }

    async function calculateFinal() {
        const name = document.getElementById('userName').value;
        const branch = document.getElementById('branchName').value;
        
        const customerTypeNode = document.querySelector('input[name="customerType"]:checked');
        const marketTypeNode = document.querySelector('input[name="marketType"]:checked');
        const statusNode = document.querySelector('input[name="progressStatus"]:checked');
        const amountNode = document.querySelector('input[name="amount"]:checked');
        const fieldNodes = document.querySelectorAll('input[name="field"]:checked');

        let score = parseInt(customerTypeNode.value);
        let fieldsArray = [];
        fieldNodes.forEach(f => { 
            score += parseInt(f.value); 
            fieldsArray.push(f.parentElement.innerText.trim());
        });

        if (customerTypeNode.value === "40") {
            score += parseInt(marketTypeNode.value);
        }
        score += parseInt(statusNode.value);
        score += parseInt(amountNode.value);

        // UI 업데이트
        document.querySelectorAll('.step-card').forEach(c => c.classList.remove('active'));
        document.getElementById('resultPage').classList.add('active');
        document.getElementById('finalInfo').innerText = `${branch} ${name} 님의 분석 결과`;
        document.getElementById('finalScore').innerText = score;

        // 구글 시트 전송용 객체 생성
        const payload = {
            branch: branch,
            name: name,
            customerType: customerTypeNode.parentElement.innerText.trim(),
            marketType: (customerTypeNode.value === "40") ? marketTypeNode.parentElement.innerText.trim() : "-",
            status: statusNode.parentElement.innerText.trim(),
            fields: fieldsArray.join(", "),
            amount: amountNode.parentElement.innerText.trim(),
            score: score
        };

        // 시트로 전송 (no-cors 모드)
        try {
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (e) { console.error("전송 에러:", e); }
    }

    // 선택 시 시각적 스타일 변경 이벤트
    document.addEventListener('change', (e) => {
        if (e.target.closest('.option-container')) {
            const container = e.target.closest('.option-container');
            const items = container.querySelectorAll('.option-item');
            items.forEach(item => {
                const input = item.querySelector('input');
                if(input.checked) item.classList.add('selected');
                else item.classList.remove('selected');
            });
        }
    });
</script>

</body>
</html>
