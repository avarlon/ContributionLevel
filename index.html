<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContributionLevel</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --primary-color: #d31145; /* AIA 브랜드 컬러 */
            --bg-overlay: rgba(0, 0, 0, 0.4);
            --card-bg: rgba(255, 255, 255, 0.98);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden; /* 스크롤 방지 (페이지 전환 방식) */
        }

        /* 배경 설정 */
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center;
            z-index: -1;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-overlay); z-index: -1;
        }

        .container {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; padding: 20px; box-sizing: border-box;
        }

        /* 스텝별 카드 스타일 */
        .step-card {
            background: var(--card-bg);
            padding: 40px; border-radius: 24px;
            width: 100%; max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: none; /* 기본 숨김 */
            flex-direction: column;
            animation: fadeIn 0.5s ease-out;
            min-height: 350px;
        }

        .step-card.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 상단 프로그레스 바 */
        .progress-container {
            margin-bottom: 30px;
        }
        .progress-bar {
            height: 4px; background: #e2e8f0; border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: var(--primary-color);
            transition: width 0.3s ease; width: 0%;
        }

        h2 { font-size: 1.4rem; color: #1e293b; margin-bottom: 25px; line-height: 1.4; word-break: keep-all; }

        input[type="text"], select {
            width: 100%; padding: 15px; border: 2px solid #e2e8f0;
            border-radius: 12px; font-size: 1.1rem; outline: none;
            transition: border-color 0.2s; box-sizing: border-box;
        }
        input[type="text"]:focus { border-color: var(--primary-color); }

        .btn-group { margin-top: auto; display: flex; gap: 10px; }

        button {
            flex: 1; padding: 15px; border-radius: 12px; font-size: 1rem;
            font-weight: 700; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-next { background: var(--primary-color); color: white; }
        .btn-next:hover { background: #b00e3a; }
        .btn-prev { background: #f1f5f9; color: #64748b; }

        /* 결과 화면 특화 */
        .result-title { color: #64748b; font-size: 1rem; margin-bottom: 5px; }
        .result-score { font-size: 4rem; font-weight: 900; color: var(--primary-color); margin: 20px 0; }
        .restart-btn { background: #1e293b; color: white; margin-top: 20px; }
    </style>
</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="container">
    <div class="step-card active" id="step1">
        <div class="progress-container"><div class="progress-bar"><div class="progress-fill" style="width: 16%"></div></div></div>
        <h2>의뢰인의 성함과<br>소속 지점을 입력해주세요.</h2>
        <input type="text" id="userName" placeholder="성함" style="margin-bottom:10px;">
        <input type="text" id="branchName" placeholder="지점명">
        <div class="btn-group">
            <button class="btn-next" onclick="nextStep(2)">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step2">
        <div class="progress-container"><div class="progress-bar"><div class="progress-fill" style="width: 32%"></div></div></div>
        <h2>영업 대상자의 구분은<br>어떻게 되나요?</h2>
        <select id="customerType">
            <option value="30">기존 고객</option>
            <option value="40">신규 고객</option>
        </select>
        <div class="btn-group">
            <button class="btn-prev" onclick="prevStep(1)">이전</button>
            <button class="btn-next" onclick="handleCustomerType()">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step3">
        <div class="progress-container"><div class="progress-bar"><div class="progress-fill" style="width: 48%"></div></div></div>
        <h2>신규 고객의 시장 구분을<br>선택해주세요.</h2>
        <select id="marketType">
            <option value="-10">1차 시장 (지인)</option>
            <option value="-5">2차 시장 (소개)</option>
            <option value="0">3차 시장 (개척)</option>
        </select>
        <div class="btn-group">
            <button class="btn-prev" onclick="prevStep(2)">이전</button>
            <button class="btn-next" onclick="nextStep(4)">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step4">
        <div class="progress-container"><div class="progress-bar"><div class="progress-fill" style="width: 64%"></div></div></div>
        <h2>현재 어느 단계까지<br>진행되었나요?</h2>
        <select id="progressStatus">
            <option value="5">제안 단계</option>
            <option value="0">컨설팅 진행 확정</option>
        </select>
        <div class="btn-group">
            <button class="btn-prev" id="prevBtn4" onclick="prevStep(2)">이전</button>
            <button class="btn-next" onclick="nextStep(5)">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step5">
        <div class="progress-container"><div class="progress-bar"><div class="progress-fill" style="width: 80%"></div></div></div>
        <h2>컨설팅의 핵심 분야를<br>선택해주세요.</h2>
        <select id="consultingField">
            <option value="10">인증</option>
            <option value="20">자금</option>
            <option value="5">일반경영</option>
            <option value="5">절세</option>
            <option value="30">R&D</option>
        </select>
        <div class="btn-group">
            <button class="btn-prev" onclick="prevStep(4)">이전</button>
            <button class="btn-next" onclick="nextStep(6)">다음으로</button>
        </div>
    </div>

    <div class="step-card" id="step6">
        <div class="progress-container"><div class="progress-bar"><div class="progress-fill" style="width: 95%"></div></div></div>
        <h2>예상되는 계약 규모는<br>어느 정도인가요?</h2>
        <select id="contractAmount">
            <option value="20">100만원 이하</option>
            <option value="15">200만원 이하</option>
            <option value="0">300만원 이하</option>
            <option value="-10">500만원 이하</option>
            <option value="-15">1,000만원 이하</option>
            <option value="-20">1,000만원 초과</option>
        </select>
        <div class="btn-group">
            <button class="btn-prev" onclick="prevStep(5)">이전</button>
            <button class="btn-next" onclick="calculateFinal()">결과 보기</button>
        </div>
    </div>

    <div class="step-card" id="resultPage">
        <div class="result-title" id="finalInfo">지점 이름</div>
        <h1 style="margin: 0; color: #1e293b;">Contribution Score</h1>
        <div class="result-score" id="finalScore">0</div>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 30px;">당신의 영업 기여도를 기반으로 산출되었습니다.</p>
        <button class="restart-btn" onclick="location.reload()">새로 계산하기</button>
    </div>
</div>

<script>
    let currentStep = 1;

    function nextStep(step) {
        // 이름/지점 필수 입력 체크
        if(currentStep === 1) {
            if(!document.getElementById('userName').value || !document.getElementById('branchName').value) {
                alert("성함과 지점명을 입력해주세요.");
                return;
            }
        }

        document.querySelectorAll('.step-card').forEach(card => card.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');
        currentStep = step;
    }

    function prevStep(step) {
        document.querySelectorAll('.step-card').forEach(card => card.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');
        currentStep = step;
    }

    // 신규 고객일 때만 Step 3(시장 구분) 노출
    function handleCustomerType() {
        const type = document.getElementById('customerType').value;
        if (type === "40") {
            nextStep(3);
            document.getElementById('prevBtn4').onclick = () => prevStep(3);
        } else {
            nextStep(4);
            document.getElementById('prevBtn4').onclick = () => prevStep(2);
        }
    }

    function calculateFinal() {
        const name = document.getElementById('userName').value;
        const branch = document.getElementById('branchName').value;
        
        let score = parseInt(document.getElementById('customerType').value);

        // 신규 고객일 경우에만 시장 구분 합산
        if (score === 40) {
            score += parseInt(document.getElementById('marketType').value);
        }

        score += parseInt(document.getElementById('progressStatus').value);
        score += parseInt(document.getElementById('consultingField').value);
        score += parseInt(document.getElementById('contractAmount').value);

        document.querySelectorAll('.step-card').forEach(card => card.classList.remove('active'));
        const resultPage = document.getElementById('resultPage');
        resultPage.classList.add('active');
        
        document.getElementById('finalInfo').innerText = `${branch} - ${name}님의 기여도`;
        document.getElementById('finalScore').innerText = score;
    }
</script>

</body>
</html>
